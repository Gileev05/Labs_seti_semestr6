<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример реализации Luxon.js</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 650px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }
        .log-item {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-left: 4px solid #3498db;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
            font-size: 15px;
            line-height: 1.5;
        }
        .log-item.error {
            border-left-color: #e74c3c;
            background: #fff5f5;
            color: #c0392b;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Результаты работы Luxon.js</h1>
        <div id="output"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
